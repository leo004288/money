<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="/css/visitor.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <div class="box">
        <h1>로그인</h1>
        <p class="msg" th:if="${msg}" th:text="${msg}">[[${msg}]]</p>
        <p class="error" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다</p>
        <p class="msg" th:if="${param.logout}">로그아웃되었습니다</p>

        <form th:action="@{/login}" method="post">
            <label>아이디
            <input type="text" name="username" placeholder="admin" autofocus required>
            </label>
            <label>비밀번호
            <input type="password" name="password" placeholder="1234" required>
            </label>
            <button type="submit">로그인</button>
        </form>
        <hr>
        <p>
            <a href="@{/member/register}">회원가입</a> |
            <a href="/index.html">홈으로</a>
        </p>
    </div>
</body>
</html>
